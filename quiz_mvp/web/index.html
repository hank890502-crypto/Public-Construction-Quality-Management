<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>公共工程品管題庫（機電）</title>
<style>
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#1c2530; --muted:#6b7787; --line:#e3e8ef;
    --brand:#1f4e79; --brand-2:#2f6fb0; --accent:#0f9d8b;
    --ok:#1f9d55; --ok-bg:#e6f6ec; --bad:#d64545; --bad-bg:#fbe9e9;
    --chip:#eef3f9; --shadow:0 8px 24px rgba(20,40,70,.10);
    --r:16px; --tap:56px;
    --e-out:cubic-bezier(.23,1,.32,1); --e-in-out:cubic-bezier(.77,0,.175,1); --e-drawer:cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="dark"]{
    --bg:#0f141a; --card:#182029; --ink:#e6ecf3; --muted:#9aa7b5; --line:#26313d;
    --brand:#4f8fd0; --brand-2:#5fa0e0; --accent:#2fd3bd;
    --chip:#1f2a35; --ok-bg:#12261a; --bad-bg:#2a1616; --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;}
  /* 響應式：手機全螢幕；電腦置中欄位 */
  .stage{min-height:100vh;min-height:100dvh;background:var(--bg);}
  .device{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;}
  @media(min-width:820px){
    body{background:#e5e9f0;}
    .stage{display:flex;justify-content:center;}
    .device{width:min(1200px,94vw);max-width:none;box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(20,40,70,.14);}
    /* 文字與元件隨視窗寬度縮放（clamp 設上限，避免超寬螢幕過大）*/
    .topbar h1{font-size:clamp(16px,1.5vw,26px);}
    .topbar .sub{font-size:clamp(11px,0.9vw,15px);}
    .scroll{padding:clamp(16px,1.8vw,32px) clamp(14px,1.8vw,32px) 96px;}
    .card{padding:clamp(16px,1.6vw,26px);border-radius:18px;}
    .card h2{font-size:clamp(15px,1.15vw,22px);}
    .ring{width:clamp(84px,7vw,120px);height:clamp(84px,7vw,120px);}
    .ring i{width:76%;height:76%;} .ring b{font-size:clamp(20px,1.7vw,30px);}
    .stat .big{font-size:clamp(22px,2vw,34px);}
    .quick button{min-height:clamp(56px,5vw,84px);font-size:clamp(14px,1.05vw,19px);}
    .quick button .k{font-size:clamp(11px,0.85vw,14px);}
    .chapter .name{font-size:clamp(14px,1.05vw,19px);} .chapter .name small{font-size:clamp(11px,0.8vw,13px);}
    .pct{font-size:clamp(12px,0.95vw,16px);}
    .seg button{font-size:clamp(13px,1vw,17px);min-height:clamp(46px,3.4vw,58px);}
    .chip{font-size:clamp(13px,1vw,16px);min-height:clamp(40px,3vw,52px);}
    .stepper .val,.stepper input{font-size:clamp(24px,2vw,32px);}
    .stepper button{width:clamp(46px,4vw,60px);height:clamp(46px,4vw,60px);font-size:clamp(22px,1.8vw,30px);}
    .btn{font-size:clamp(15px,1.1vw,19px);}
    .qmeta .no{font-size:clamp(15px,1.2vw,20px);}
    .tabbar button{font-size:clamp(11px,0.85vw,14px);} .tabbar .ic{font-size:clamp(19px,1.5vw,24px);}
    .kpi b{font-size:clamp(20px,1.7vw,28px);}
    .score-ring{width:clamp(150px,14vw,220px);height:clamp(150px,14vw,220px);}
    .score-ring i{width:80%;height:80%;} .score-ring b{font-size:clamp(38px,3.4vw,56px);}
  }

  /* ---- app chrome ---- */
  .app{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg);}
  .topbar{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
    display:flex;align-items:center;gap:10px;z-index:20;}
  .topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;flex:1;}
  .topbar .sub{font-size:11px;opacity:.85;font-weight:400;}
  .icon-btn{width:38px;height:38px;border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 90px;}
  .screen{display:none;} .screen.active{display:block;animation:fade .28s var(--e-out);}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{margin:0 0 12px;font-size:15px;} .muted{color:var(--muted);}
  .row{display:flex;align-items:center;gap:12px;}

  /* progress ring */
  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .ring{--p:0;width:84px;height:84px;border-radius:50%;flex:none;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--line) 0);
    display:flex;align-items:center;justify-content:center;}
  .ring i{width:64px;height:64px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-style:normal;}
  .ring b{font-size:20px;} .ring span{font-size:10px;color:var(--muted);}
  .stat{flex:1;} .stat .big{font-size:22px;font-weight:700;} .stat small{color:var(--muted);}

  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .quick button{min-height:var(--tap);border:1px solid var(--line);background:var(--card);border-radius:14px;
    font-size:14px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;
    justify-content:center;gap:2px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);}
  .quick button .k{font-size:11px;color:var(--muted);font-weight:500;}
  .quick .primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .quick .primary .k{color:rgba(255,255,255,.8);}

  .chapter{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .chapter:last-child{border-bottom:none;}
  .chapter .name{flex:1;font-size:14px;} .chapter .name small{display:block;color:var(--muted);font-size:11px;margin-top:3px;}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px;}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s var(--e-out);}
  .pct{font-size:12px;color:var(--muted);width:34px;text-align:right;}

  /* setup */
  .seg{display:flex;flex-wrap:wrap;gap:8px;}
  .seg button{flex:1 1 auto;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;
    font-size:13px;color:var(--ink);cursor:pointer;padding:6px 10px;}
  .seg button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);
    font-size:13px;cursor:pointer;display:flex;align-items:center;}
  .chip.on{background:var(--brand-2);color:#fff;border-color:var(--brand-2);}
  .stepper{display:flex;align-items:center;gap:14px;}
  .stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    font-size:22px;cursor:pointer;color:var(--ink);}
  .stepper .val{font-size:26px;font-weight:700;min-width:56px;text-align:center;}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
  .toggle:last-child{border-bottom:none;} .toggle span{font-size:14px;}
  .sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background-color .2s ease;flex:none;}
  .sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .22s var(--e-out);box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .sw.on{background:var(--accent);} .sw.on i{transform:translateX(20px);}

  /* answering */
  .quiz-top{background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;position:relative;z-index:15;}
  .pbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;}
  .pbar i{display:block;height:100%;background:var(--brand);transition:width .3s var(--e-out);}
  .qmeta{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .qmeta .no{font-weight:700;font-size:15px;} .tag{font-size:11px;background:var(--chip);color:var(--muted);padding:4px 8px;border-radius:8px;}
  .qmeta .spacer{flex:1;}
  .timer{font-size:13px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;}
  .saved{font-size:11px;color:var(--ok);display:flex;align-items:center;gap:4px;}
  .saved b{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;}
  .fontctl{display:flex;gap:6px;}
  .fontctl button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);}

  .qbody{padding:18px 16px 16px;}
  .stem{font-size:var(--qfs,17px);line-height:1.7;font-weight:600;margin-bottom:18px;}
  .opt{display:flex;gap:12px;align-items:flex-start;min-height:var(--tap);width:100%;text-align:left;
    border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px;margin-bottom:12px;
    font-size:calc(var(--qfs,17px) - 2px);color:var(--ink);cursor:pointer;transition:transform .12s var(--e-out),border-color .15s ease,background-color .15s ease;line-height:1.5;}
  .opt .lb{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);}
  .opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--card));}
  .opt.sel .lb{background:var(--brand);color:#fff;border-color:var(--brand);}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg);} .opt.correct .lb{background:var(--ok);color:#fff;border-color:var(--ok);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);} .opt.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad);}
  .exp{background:var(--chip);border-radius:14px;padding:14px;font-size:14px;line-height:1.7;display:none;}
  .exp.show{display:block;animation:fade .2s var(--e-out);} .exp .h{font-weight:700;margin-bottom:6px;color:var(--brand);}
  .exp .ai{display:inline-block;font-size:10px;background:#ffe9c7;color:#8a5a00;padding:2px 7px;border-radius:6px;margin-left:6px;}
  html[data-theme="dark"] .exp .ai{background:#4a3410;color:#ffd591;}

  .quiz-bottom{border-top:1px solid var(--line);background:var(--card);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
    display:flex;gap:8px;align-items:center;z-index:15;}
  .tool{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;}
  .tool.on{color:#e8a13a;border-color:#e8a13a;} .tool.flag.on{color:var(--bad);border-color:var(--bad);}
  .btn{flex:1;min-height:48px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.ghost{background:var(--chip);color:var(--ink);flex:0 0 92px;}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn:disabled{opacity:.45;}

  /* nav drawer */
  .sheet-mask{position:absolute;inset:0;background:rgba(10,20,35,.45);display:none;z-index:40;}
  .sheet-mask.show{display:block;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
    transform:translateY(100%);transition:transform .32s var(--e-drawer);z-index:50;}
  .sheet.show{transform:none;}
  .sheet h3{margin:0 0 14px;font-size:15px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .gcell{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-weight:700;cursor:pointer;background:var(--card);}
  .gcell.done{background:var(--brand);color:#fff;border-color:var(--brand);}
  .gcell.flagged{border-color:var(--bad);color:var(--bad);}
  .gcell.cur{outline:3px solid var(--accent);outline-offset:1px;}
  .legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .legend b{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px;}

  /* result */
  .score-ring{--p:0;width:150px;height:150px;border-radius:50%;margin:6px auto 16px;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--line) 0);display:flex;align-items:center;justify-content:center;}
  .score-ring i{width:120px;height:120px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;}
  .score-ring b{font-size:38px;line-height:1;} .score-ring span{font-size:12px;color:var(--muted);margin-top:4px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:6px;}
  .kpi{background:var(--chip);border-radius:12px;padding:12px 6px;} .kpi b{font-size:20px;display:block;} .kpi small{color:var(--muted);}
  .pass{font-weight:800;font-size:16px;padding:4px 12px;border-radius:999px;display:inline-block;}
  .pass.ok{background:var(--ok-bg);color:var(--ok);} .pass.no{background:var(--bad-bg);color:var(--bad);}

  .wrong-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .wrong-item:last-child{border-bottom:none;}
  .wrong-item .badge{flex:none;width:30px;height:30px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .wrong-item .t{font-size:13px;line-height:1.5;flex:1;} .wrong-item .t small{color:var(--muted);}

  /* bottom nav */
  .tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;}
  .tabbar button{flex:1;background:none;border:none;padding:8px 0 10px;color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .tabbar button.on{color:var(--brand);} .tabbar .ic{font-size:19px;line-height:1;}
  .hide{display:none !important;}
  .toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#111c28;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;transition:opacity .25s ease,transform .25s var(--e-out);z-index:70;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%);}
  .demo-flag{font-size:10px;background:var(--accent);color:#04231f;padding:2px 7px;border-radius:6px;font-weight:700;}
  html[data-theme="dark"] .demo-flag{color:#04231f;}
  /* ===== 動態品質微調（依 Emil Kowalski 標準）===== */
  .btn,.quick button,.chip,.seg button,.stepper button,.tool,.fontctl button,.icon-btn,.gcell{
    transition:transform .12s var(--e-out),background-color .14s ease,border-color .14s ease,color .14s ease,box-shadow .14s ease;}
  .btn:active:not(:disabled),.quick button:active,.chip:active,.seg button:active,
  .stepper button:active,.tool:active,.fontctl button:active,.icon-btn:active,.gcell:active{transform:scale(.97);}
  .opt:active{transform:scale(.985);}
  .tabbar .ic{display:inline-block;transition:transform .12s var(--e-out);}
  .tabbar button:active .ic{transform:scale(.88);}
  @media (hover:hover) and (pointer:fine){
    .quick button:hover,.chip:hover,.seg button:hover:not(.on),.gcell:hover,.opt:hover{border-color:var(--brand-2);}
    .btn.primary:hover,.quick .primary:hover{filter:brightness(1.06);}
    .icon-btn:hover{background:rgba(255,255,255,.28);}
  }
  @media (prefers-reduced-motion:reduce){
    @keyframes fade{from{opacity:0}to{opacity:1}}
    *,*::before,*::after{transition-duration:.12s !important;animation-duration:.2s !important;}
    .btn:active,.quick button:active,.chip:active,.seg button:active,.stepper button:active,
    .tool:active,.fontctl button:active,.icon-btn:active,.gcell:active,.opt:active,.tabbar button:active .ic{transform:none !important;}
  }
  /* ===== 好友對戰 PK ===== */
  .bt-head{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;}
  .bt-head .bt-name{font-size:11px;color:var(--muted);font-weight:600}
  .bt-score{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
  .bt-score .me{color:var(--brand)} .bt-score .op{color:var(--bad)} .bt-score .vs{color:var(--muted);font-size:15px}
  .bt-count{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:3px solid var(--brand);color:var(--brand);font-variant-numeric:tabular-nums;transition:color .2s,border-color .2s}
  .bt-count.warn{border-color:var(--bad);color:var(--bad)}
  .bt-round{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 2px}
  .bt-status{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 0;line-height:1.6}
  .bt-code{font-size:32px;font-weight:800;letter-spacing:4px;text-align:center;margin:14px 0;color:var(--brand)}
  .bt-big{font-size:24px;font-weight:800;text-align:center;margin:6px 0}
  .opt.op-pick{box-shadow:inset 0 0 0 2px var(--muted)}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="app">
      <!-- ===== top bar (hidden during quiz/result) ===== -->
      <div class="topbar" id="topbar">
        <div style="flex:1">
          <h1>公共工程品管題庫 <span class="demo-flag">機電</span></h1>
          <div class="sub">115 年 1 月起適用 · 共 2,538 題</div>
        </div>
        <button class="icon-btn" onclick="toggleTheme()" title="深色模式" id="themeBtn">☾</button>
      </div>

      <!-- ===== scrollable body ===== -->
      <div class="scroll" id="scroll">

        <!-- HOME -->
        <section class="screen active" data-screen="home">
          <div class="card">
            <div class="ring-wrap">
              <div class="ring" id="homeRing" style="--p:0"><i><b id="homeAcc">—</b><span>整體正確率</span></i></div>
              <div class="stat">
                <div class="big"><span id="homeAnswered">0</span> <small>/ <span id="homeTotal">2,538</span> 題已作答</small></div>
                <div class="muted" id="homeMeta" style="font-size:13px;margin-top:6px">錯題 0 · 收藏 0</div>
                <div class="bar" style="margin-top:10px"><i id="homeBar" style="width:0%"></i></div>
              </div>
            </div>
          </div>
          <div class="quick">
            <button class="primary" onclick="go('setup')"><span class="k">自訂章節與題數</span>開始練習 ▸</button>
            <button onclick="go('setup')"><span class="k">全部章節隨機</span>快速練習</button>
            <button onclick="startMock()"><span class="k">固定題數／時間</span>模擬考</button>
            <button onclick="go('wrong')"><span class="k"><span id="wrongCount">0</span> 題待複習</span>錯題複習</button>
          </div>
          <button class="btn primary" style="width:100%;min-height:56px;margin-bottom:14px;font-size:16px" onclick="go('battle')">🆚 好友對戰 PK</button>
          <div class="card">
            <h2>章節進度</h2>
            <div id="chapters"></div>
          </div>
          <p class="muted" style="font-size:12px;text-align:center">題目即時取自資料庫</p>
        </section>

        <!-- SETUP -->
        <section class="screen" data-screen="setup">
          <div class="card">
            <h2>作答模式</h2>
            <div class="seg" id="modeSeg">
              <button class="on" data-mode="instant">即時練習</button>
              <button data-mode="full">完整測驗</button>
              <button data-mode="mock">模擬考</button>
              <button data-mode="wrong">錯題複習</button>
              <button data-mode="read">閱讀背題</button>
            </div>
            <p class="muted" id="modeDesc" style="font-size:13px;margin:12px 0 0">即時練習：每答完一題立即顯示對錯與解析。</p>
          </div>
          <div class="card">
            <h2 style="display:flex;align-items:center;justify-content:space-between">選擇章節
              <button id="allChapBtn" onclick="toggleAllChapters()" style="font-size:12px;font-weight:600;color:#fff;background:var(--brand-2);border:none;border-radius:8px;padding:6px 12px;cursor:pointer">全選</button>
            </h2>
            <p class="muted" style="font-size:12px;margin:0 0 10px">不選＝全部章節隨機出題</p>
            <div class="chips" id="chapChips"></div>
          </div>
          <div class="card">
            <h2>題數</h2>
            <div class="stepper">
              <button onclick="stepCount(-5)">−</button>
              <input class="val" id="countVal" type="number" inputmode="numeric" min="1" max="100" value="20" onchange="clampCount()" style="width:96px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)">
              <button onclick="stepCount(5)">＋</button>
              <span class="muted" style="font-size:13px">題 · 常見 20–50</span>
            </div>
          </div>
          <div class="card">
            <h2>選項</h2>
            <div class="toggle"><span>打亂題目順序</span><div class="sw on" id="swShuffleQ" onclick="this.classList.toggle('on')"><i></i></div></div>
            <div class="toggle"><span>打亂選項順序</span><div class="sw" id="swShuffleOpt" onclick="this.classList.toggle('on')"><i></i></div></div>
            <div class="toggle"><span>未作答優先</span><div class="sw on" id="swUnanswered" onclick="this.classList.toggle('on')"><i></i></div></div>
          </div>
          <button class="btn primary" style="width:100%;min-height:54px" onclick="startQuiz()">開始作答</button>
          <div style="height:10px"></div>
          <button class="btn ghost" style="width:100%;min-height:46px;flex:none" onclick="go('home')">返回</button>
        </section>

        <!-- WRONG BOOK -->
        <section class="screen" data-screen="wrong">
          <div class="card">
            <h2>錯題本 <span class="muted" style="font-weight:400;font-size:13px">· 168 題</span></h2>
            <div id="wrongList"></div>
          </div>
          <button class="btn primary" style="width:100%;min-height:52px" onclick="startQuiz(true)">開始複習錯題</button>
        </section>

        <!-- ME -->
        <section class="screen" data-screen="me">
          <div class="card">
            <h2>我的</h2>
            <div class="toggle"><span>深色模式</span><div class="sw" id="themeSw" onclick="toggleTheme()"><i></i></div></div>
            <div class="toggle"><span>作答自動儲存</span><div class="sw on"><i></i></div></div>
            <div class="toggle"><span>推播通知（PWA / LINE）</span><div class="sw on"><i></i></div></div>
            <div class="toggle"><span>同時登入裝置：手機＋電腦</span><span class="muted" style="font-size:13px">2 / 2</span></div>
          </div>
          <div class="card">
            <h2>我的方案</h2>
            <div id="planBox"><p class="muted" style="font-size:14px;margin:0">讀取中…</p></div>
            <div style="margin-top:14px">
              <label style="font-size:13px;color:var(--muted)">輸入授權碼</label>
              <div style="display:flex;gap:8px;margin-top:6px">
                <input id="codeInput" placeholder="PQC-XXXX-XXXX" autocomplete="off"
                  style="flex:1;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;background:var(--card);color:var(--ink)">
                <button class="btn primary" style="flex:0 0 92px;min-height:46px" onclick="doRedeem()">兌換</button>
              </div>
              <p id="redeemMsg" style="font-size:13px;margin:8px 0 0"></p>
            </div>
          </div>
          <p class="muted" style="font-size:12px;text-align:center">公共工程品管題庫（機電）</p>
        </section>

        <!-- QUIZ -->
        <section class="screen" data-screen="quiz" id="quizScreen"></section>

        <!-- RESULT -->
        <section class="screen" data-screen="result" id="resultScreen"></section>
        <section class="screen" data-screen="battle" id="battleScreen"></section>
      </div>

      <!-- ===== bottom tab bar ===== -->
      <nav class="tabbar" id="tabbar">
        <button class="on" data-tab="home" onclick="go('home')"><span class="ic">☗</span>首頁</button>
        <button data-tab="setup" onclick="go('setup')"><span class="ic">✎</span>練習</button>
        <button data-tab="wrong" onclick="go('wrong')"><span class="ic">✗</span>錯題</button>
        <button data-tab="me" onclick="go('me')"><span class="ic">☺</span>我的</button>
      </nav>

      <!-- nav sheet + confirm sheet + toast -->
      <div class="sheet-mask" id="mask" onclick="closeSheets()"></div>
      <div class="sheet" id="navSheet">
        <h3>題目導覽</h3>
        <div class="grid" id="navGrid"></div>
        <div class="legend">
          <span><b style="background:var(--brand)"></b>已作答</span>
          <span><b style="background:var(--card);border:1px solid var(--line)"></b>未作答</span>
          <span><b style="background:var(--card);border:1px solid var(--bad)"></b>已標記</span>
        </div>
      </div>
      <div class="sheet" id="submitSheet">
        <h3>確定要交卷嗎？</h3>
        <p class="muted" id="submitInfo" style="font-size:14px;margin:0 0 16px"></p>
        <button class="btn primary" style="width:100%;min-height:50px" onclick="doSubmit()">確定交卷</button>
        <div style="height:10px"></div>
        <button class="btn ghost" style="width:100%;min-height:46px;flex:none" onclick="closeSheets()">再檢查一下</button>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <!-- -->

</div>

<script>
/* ===== 題庫 MVP 前端邏輯（呼叫 /api，取真實題目）===== */
let SID=null, Q=[], idx=0, fontStep=0, timer=null, timeLeft=40*60, mode='practice', curMode='practice';
let selChap=new Set(), chaptersLoaded=false;
const MODE_MAP={instant:'practice',full:'full',mock:'mock',wrong:'wrong_review',read:'read'};
const MODE_DESC={instant:"即時練習：每答完一題立即顯示對錯與解析。",full:"完整測驗：作答中不顯示答案，交卷後批改。",mock:"模擬考：固定題數與時間，時間到自動交卷。",wrong:"錯題複習：僅出現先前答錯的題目。",read:"閱讀背題：直接顯示題目與答案。"};

function clientToken(){
  try{ let t=localStorage.getItem('cid'); if(!t){ t=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('t'+Date.now()+'-'+Math.random().toString(16).slice(2)); localStorage.setItem('cid',t);} return t; }
  catch(e){ return 'anon'; }
}
async function api(path, opts){
  const r = await fetch('/api'+path, {headers:{'Content-Type':'application/json','X-Client-Token':clientToken()}, ...(opts||{})});
  if(!r.ok){ let t=''; try{t=(await r.json()).detail||'';}catch(e){} throw new Error(t||('HTTP '+r.status)); }
  return r.json();
}

function go(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.dataset.screen===s));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===s));
  const quiz=(s==='quiz'||s==='result'||s==='battle');
  document.getElementById('topbar').classList.toggle('hide',quiz);
  document.getElementById('tabbar').classList.toggle('hide',quiz);
  document.getElementById('scroll').scrollTop=0;
  if(timer&&s!=='quiz'){clearInterval(timer);timer=null;}
  if(s!=='battle') battleLeave();
  if(s==='battle') renderBattleSetup();
  if(s==='wrong') loadWrong();
  if(s==='me') renderPlan();
  if(s==='home') renderHome();
  if((s==='home'||s==='setup')&&!chaptersLoaded) renderChapters();
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}
function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'☾':'☀';const sw=document.getElementById('themeSw');if(sw)sw.classList.toggle('on',!d);}

async function renderChapters(){
  try{
    const d=await api('/chapters');
    let html='',chips='';
    d.units.forEach(u=>u.chapters.forEach(c=>{
      const short=c.chapter.replace(/^第.章\s*/,'');
      html+=`<div class="chapter" onclick="go('setup')"><div class="name">${u.unit}·${short}<small>${c.count} 題</small></div><div class="pct">${c.count}</div></div>`;
      chips+=`<div class="chip" data-id="${c.chapter_id}" onclick="toggleChip(this)">${short}</div>`;
    }));
    document.getElementById('chapters').innerHTML=html;
    document.getElementById('chapChips').innerHTML=chips;
    chaptersLoaded=true;
  }catch(e){document.getElementById('chapters').innerHTML='<p class="muted" style="font-size:13px">無法連線後端：'+e.message+'</p>';}
}
function toggleChip(el){el.classList.toggle('on');const id=el.dataset.id;if(selChap.has(id))selChap.delete(id);else selChap.add(id);}
function countEl(){return document.getElementById('countVal');}
function clampCount(){let v=parseInt(countEl().value)||20;v=Math.max(1,Math.min(100,v));countEl().value=v;return v;}
function stepCount(d){let v=parseInt(countEl().value)||20;v=Math.max(1,Math.min(100,v+d));countEl().value=v;}
function startMock(){curMode='mock';go('setup');document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.mode==='mock'));document.getElementById('modeDesc').textContent=MODE_DESC.mock;}

async function startQuiz(fromWrong){
  mode = fromWrong ? 'wrong_review' : curMode;
  const count = clampCount();
  go('quiz');
  document.getElementById('quizScreen').innerHTML='<div style="padding:60px 20px;text-align:center" class="muted">載入題目中…</div>';
  try{
    const on=id=>{const el=document.getElementById(id);return el?el.classList.contains('on'):false;};
    const d=await api('/sessions',{method:'POST',body:JSON.stringify({count,mode,chapter_ids:selChap.size?[...selChap]:null,
      shuffle_questions:on('swShuffleQ'),shuffle_options:on('swShuffleOpt'),unanswered_first:on('swUnanswered')})});
    SID=d.session_id;
    Q=d.questions.map(q=>({item_id:q.item_id,no:q.no,chapter:q.chapter,stem:q.stem,
      opts:Object.fromEntries((q.options||[]).map(o=>[o.label,o.content])),
      picked:undefined,ans:null,exp:null,fav:false,flag:false}));
    idx=0; renderQuiz(); toast('已載入 '+Q.length+' 題');
    if(mode==='mock'){timeLeft=40*60;startTimer();}
  }catch(e){
    const gate=(''+e.message).indexOf('授權')>=0;
    const msg=gate?e.message:('無法建立作答：'+e.message);
    document.getElementById('quizScreen').innerHTML='<div style="padding:50px 24px;text-align:center" class="muted">'+msg+(gate?'<br><br><button class="btn primary" style="max-width:240px;margin:0 auto" onclick="go(\'me\')">前往「我的」輸入授權碼</button>':'')+'</div>';
  }
}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{timeLeft--;const m=String(Math.floor(timeLeft/60)).padStart(2,'0'),s=String(timeLeft%60).padStart(2,'0');const t=document.getElementById('timer');if(t)t.textContent=m+':'+s;if(timeLeft<=0){clearInterval(timer);openSubmit(true);}},1000);}

function renderQuiz(){
  const q=Q[idx]; const reveal=(mode==='practice'||mode==='wrong_review'||mode==='read');
  const graded=q.picked!==undefined && reveal && q.ans!==null;
  const fs=quizBase()+fontStep*2;
  const optHtml=Object.entries(q.opts).map(([k,v])=>{
    let cls='opt';
    if(graded){ if(k===q.ans)cls+=' correct'; else if(k===q.picked)cls+=' wrong'; }
    else if(k===q.picked)cls+=' sel';
    return `<button class="${cls}" onclick="pick('${k}')"><span class="lb">${k}</span><span>${v}</span></button>`;
  }).join('');
  const expHtml=graded?`<div class="exp show"><div class="h">解析 <span class="ai">AI 產生 · 未審核</span></div>${q.exp||'（此題尚未建立解析，待人工補充）'}<div class="muted" style="margin-top:8px;font-size:12px">法規依據：（待補）</div></div>`:'';
  document.getElementById('quizScreen').innerHTML=`
    <div class="quiz-top">
      <div class="pbar"><i style="width:${(idx+1)/Q.length*100}%"></i></div>
      <div class="qmeta">
        <span class="no">${idx+1} / ${Q.length}</span>
        <span class="tag">${q.chapter.replace(/^第.章\s*/,'')}</span>
        <span class="tag">第 ${q.no} 題</span>
        <span class="spacer"></span>
        ${mode==='mock'?'<span class="timer" id="timer">40:00</span>':'<span class="saved"><b></b>已自動儲存</span>'}
      </div>
      <div class="row" style="margin-top:8px;justify-content:space-between">
        <button onclick="go('home')" title="暫存離開" style="border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;white-space:nowrap;cursor:pointer">✕ 暫存離開</button>
        <div class="fontctl"><button onclick="setFont(-1)">A−</button><button onclick="setFont(1)">A＋</button><button onclick="openNav()" title="題目導覽">☷</button></div>
      </div>
    </div>
    <div class="qbody" style="--qfs:${fs}px">
      <div class="stem">${q.stem}</div>
      ${optHtml}
      ${expHtml}
    </div>
    <div class="quiz-bottom">
      <button class="tool ${q.flag?'flag on':'flag'}" onclick="toggleFlag()" title="標記">⚑</button>
      <button class="tool ${q.fav?'on':''}" onclick="toggleFav()" title="收藏">★</button>
      <button class="btn ghost" onclick="prev()" ${idx===0?'disabled':''}>上一題</button>
      ${idx<Q.length-1?`<button class="btn primary" onclick="next()">下一題</button>`:`<button class="btn primary" onclick="openSubmit(false)">交卷</button>`}
    </div>`;
}
async function pick(k){
  const q=Q[idx];
  const reveal=(mode==='practice'||mode==='wrong_review'||mode==='read');
  if(reveal && q.picked!==undefined) return;   /* 揭曉模式（即時/錯題/背題）：答完即鎖定，避免看到答案後再改 */
  if(q.picked===k) return;                      /* 選項沒改變就不重送；考試模式可自由改選 */
  q.picked=k; renderQuiz();
  try{
    const r=await api('/sessions/'+SID+'/answer',{method:'POST',body:JSON.stringify({item_id:q.item_id,selected:k})});
    if(r.correct_label!==undefined){q.ans=r.correct_label;q.exp=r.explanation;}
    renderQuiz();
  }catch(e){toast('儲存失敗：'+e.message);}
}
function next(){if(idx<Q.length-1){idx++;renderQuiz();document.getElementById('scroll').scrollTop=0;}}
function prev(){if(idx>0){idx--;renderQuiz();document.getElementById('scroll').scrollTop=0;}}
function setFont(d){fontStep=Math.max(-1,Math.min(3,fontStep+d));renderQuiz();}
function toggleFlag(){Q[idx].flag=!Q[idx].flag;renderQuiz();toast(Q[idx].flag?'已標記':'已取消標記');}
function toggleFav(){Q[idx].fav=!Q[idx].fav;renderQuiz();toast(Q[idx].fav?'已收藏':'已取消收藏');}

function openNav(){
  document.getElementById('navGrid').innerHTML=Q.map((q,i)=>{
    let cls='gcell';if(q.picked!==undefined)cls+=' done';if(q.flag)cls+=' flagged';if(i===idx)cls+=' cur';
    return `<div class="${cls}" onclick="jump(${i})">${i+1}</div>`;}).join('');
  document.getElementById('mask').classList.add('show');document.getElementById('navSheet').classList.add('show');
}
function jump(i){idx=i;closeSheets();renderQuiz();}
function openSubmit(auto){
  const done=Q.filter(q=>q.picked!==undefined).length, un=Q.length-done;
  document.getElementById('submitInfo').textContent=auto?'時間到，系統將自動交卷。':`已作答 ${done} 題，尚有 ${un} 題未作答。`;
  document.getElementById('mask').classList.add('show');document.getElementById('submitSheet').classList.add('show');
}
function closeSheets(){document.getElementById('mask').classList.remove('show');document.getElementById('navSheet').classList.remove('show');document.getElementById('submitSheet').classList.remove('show');}

async function doSubmit(){
  closeSheets(); if(timer){clearInterval(timer);timer=null;}
  let res;
  try{ res=await api('/sessions/'+SID+'/submit',{method:'POST'}); }
  catch(e){ toast('交卷失敗：'+e.message); return; }
  const pass=res.pass;
  document.getElementById('resultScreen').innerHTML=`
    <div class="card" style="text-align:center">
      <div class="score-ring" style="--p:${res.score}"><i><b>${res.score}</b><span>正確率</span></i></div>
      <div class="pass ${pass?'ok':'no'}">${pass?'✓ 及格':'✗ 未達 60 分'}</div>
      <div class="kpis" style="margin-top:16px">
        <div class="kpi"><b style="color:var(--ok)">${res.correct}</b><small>答對</small></div>
        <div class="kpi"><b style="color:var(--bad)">${res.wrong}</b><small>答錯</small></div>
        <div class="kpi"><b>${res.unanswered}</b><small>未作答</small></div>
      </div>
    </div>
    <div class="card"><h2>各章正確率</h2>
      ${res.per_chapter.map(c=>{const acc=c.accuracy;return `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${c.chapter.replace(/^第.章\s*/,'')}</span><span class="muted">${acc}%</span></div><div class="bar"><i style="width:${acc}%;background:${acc<50?'var(--bad)':'var(--accent)'}"></i></div></div>`;}).join('')}
    </div>
    <div class="card"><h2>錯題清單 <span class="muted" style="font-weight:400;font-size:13px">· ${res.wrong_list.length} 題</span></h2>
      ${res.wrong_list.length?res.wrong_list.map(w=>`<div class="wrong-item"><div class="badge">✗</div><div class="t">${w.stem.slice(0,34)}…<br><small>正解 ${w.correct_label} · 你選 ${w.your||'—'} · ${w.chapter.replace(/^第.章\s*/,'')}</small></div></div>`).join(''):'<p class="muted" style="font-size:14px">全部答對，太強了！</p>'}
    </div>
    <button class="btn primary" style="width:100%;min-height:52px" onclick="startQuiz(true)">只做錯題</button>
    <div style="height:10px"></div>
    <button class="btn ghost" style="width:100%;min-height:48px;flex:none" onclick="go('home')">回首頁</button>`;
  go('result');
}

async function loadWrong(){
  const el=document.getElementById('wrongList');
  try{
    const d=await api('/wrong');
    el.innerHTML=d.items.length? d.items.map(w=>`<div class="wrong-item"><div class="badge">×${w.wrong_count}</div><div class="t">${(w.stem||'').slice(0,34)}…<br><small>${(w.chapter||'').replace(/^第.章\s*/,'')}</small></div></div>`).join('') : '<p class="muted" style="font-size:14px">目前沒有錯題，先去練習吧！</p>';
  }catch(e){el.innerHTML='<p class="muted" style="font-size:13px">無法載入錯題：'+e.message+'</p>';}
}

/* mode segment handlers */
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); curMode=MODE_MAP[b.dataset.mode]||'practice';
  document.getElementById('modeDesc').textContent=MODE_DESC[b.dataset.mode];
});

function toggleAllChapters(){
  const chips=[...document.querySelectorAll('#chapChips .chip')];
  if(!chips.length) return;
  const allOn=chips.every(c=>c.classList.contains('on'));
  chips.forEach(c=>{ if(allOn){c.classList.remove('on');selChap.delete(c.dataset.id);} else {c.classList.add('on');selChap.add(c.dataset.id);} });
  const btn=document.getElementById('allChapBtn'); if(btn) btn.textContent=allOn?'全選':'全不選';
}
async function renderHome(){
  try{
    const s=await api('/stats');
    const acc=s.accuracy||0;
    const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
    const ring=document.getElementById('homeRing'); if(ring) ring.style.setProperty('--p',acc);
    set('homeAcc',acc+'%');
    set('homeAnswered',(s.answered||0).toLocaleString());
    set('homeTotal',(s.total||0).toLocaleString());
    set('homeMeta','錯題 '+(s.wrong||0)+' · 收藏 '+(s.favorites||0));
    const bar=document.getElementById('homeBar'); if(bar) bar.style.width=(s.total?Math.round((s.answered||0)/s.total*100):0)+'%';
    set('wrongCount',(s.wrong||0));
  }catch(e){}
}
async function renderPlan(){
  const box=document.getElementById('planBox'); if(!box) return;
  try{
    const p=await api('/plan');
    if(p.active){
      const d=p.expires_at?new Date(p.expires_at):null;
      box.innerHTML='<p style="margin:0;font-size:15px;font-weight:700">使用中 · 剩 '+(p.days_left??0)+' 天</p>'+
        '<p class="muted" style="font-size:13px;margin:6px 0 0">到期日 '+(d?d.toLocaleDateString():'—')+'　可看解析 · 可模擬考</p>';
    }else{
      box.innerHTML='<p style="margin:0;font-size:15px;font-weight:700;color:var(--bad)">授權已到期</p>'+
        '<p class="muted" style="font-size:13px;margin:6px 0 0">輸入授權碼即可繼續使用；你的錯題與作答紀錄都會保留。</p>';
    }
  }catch(e){ box.innerHTML='<p class="muted" style="font-size:13px;margin:0">無法讀取方案：'+e.message+'</p>'; }
}
async function doRedeem(){
  const msg=document.getElementById('redeemMsg'); const code=document.getElementById('codeInput').value.trim();
  if(!code){ msg.style.color='var(--bad)'; msg.textContent='請輸入授權碼'; return; }
  msg.style.color='var(--muted)'; msg.textContent='兌換中…';
  try{
    const r=await api('/redeem',{method:'POST',body:JSON.stringify({code})});
    msg.style.color='var(--ok)';
    msg.textContent='兌換成功！有效至 '+(r.expires_at?new Date(r.expires_at).toLocaleDateString():'—')+'（剩 '+(r.days_left??0)+' 天）';
    document.getElementById('codeInput').value=''; renderPlan(); renderHome();
  }catch(e){ msg.style.color='var(--bad)'; msg.textContent='兌換失敗：'+e.message; }
}
function quizBase(){ return Math.max(17, Math.min(24, Math.round(17 + (window.innerWidth-820)/170))); }
let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz=setTimeout(()=>{ const a=document.querySelector('.screen.active'); if(a && a.dataset.screen==='quiz') renderQuiz(); }, 150); });

/* ===== 好友對戰 PK（WebSocket）===== */
let bws=null, bstate=null, bTimer=null, bMode='create', bCount=10;
function wsURL(){return (location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws/battle';}
function battleLeave(){ if(bTimer){clearInterval(bTimer);bTimer=null;} if(bws){try{bws.onclose=null;bws.close();}catch(e){} bws=null;} bstate=null; }
function btBack(){ battleLeave(); }
const BT_TOP='<div class="quiz-top"><div class="row" style="justify-content:space-between"><button onclick="go(\'home\')" style="border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer">✕ 離開</button><b style="font-size:15px">好友對戰 PK</b><span style="width:52px"></span></div></div>';

let bChap=new Set(), _btChaps=null;
async function loadBattleChaps(){
  const wrap=document.getElementById('btChapChips'); if(!wrap) return;
  try{
    if(!_btChaps){ const d=await api('/chapters'); _btChaps=[]; d.units.forEach(u=>u.chapters.forEach(c=>_btChaps.push({id:c.chapter_id,name:c.chapter.replace(/^第.章\s*/,'')}))); }
    wrap.innerHTML=_btChaps.map(c=>`<div class="chip${bChap.has(c.id)?' on':''}" data-id="${c.id}" onclick="btToggleChip(this)">${c.name}</div>`).join('');
  }catch(e){ wrap.innerHTML='<span class="muted" style="font-size:13px">章節載入失敗：'+e.message+'</span>'; }
}
function btToggleChip(el){el.classList.toggle('on');const id=el.dataset.id;if(bChap.has(id))bChap.delete(id);else bChap.add(id);}
function btToggleAllChaps(){
  const chips=[...document.querySelectorAll('#btChapChips .chip')]; if(!chips.length) return;
  const allOn=chips.every(c=>c.classList.contains('on'));
  chips.forEach(c=>{ if(allOn){c.classList.remove('on');bChap.delete(c.dataset.id);} else {c.classList.add('on');bChap.add(c.dataset.id);} });
  const btn=document.getElementById('btAllChap'); if(btn) btn.textContent=allOn?'全選':'全不選';
}
function renderBattleSetup(){
  battleLeave(); bstate={phase:'setup'};
  document.getElementById('battleScreen').innerHTML=BT_TOP+`
   <div class="qbody">
     <div class="card"><h2>對戰模式</h2>
       <div class="seg" id="btModeSeg">
         <button class="on" data-m="create">開房間</button>
         <button data-m="join">加入房間</button>
         <button data-m="quick">快速配對</button>
       </div>
       <div id="btJoinWrap" style="margin-top:12px;display:none">
         <input id="btCode" placeholder="輸入房碼 PK-XXXX" autocomplete="off" style="width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;text-transform:uppercase;background:var(--card);color:var(--ink)">
       </div>
       <p class="muted" id="btModeDesc" style="font-size:13px;margin:12px 0 0">開房間：產生房碼給朋友加入。</p>
     </div>
     <div class="card" id="btChapCard"><h2 style="display:flex;align-items:center;justify-content:space-between">選擇章節<button id="btAllChap" onclick="btToggleAllChaps()" style="font-size:12px;font-weight:600;color:#fff;background:var(--brand-2);border:none;border-radius:8px;padding:6px 12px;cursor:pointer">全選</button></h2>
       <p class="muted" style="font-size:12px;margin:0 0 10px">不選＝全部章節隨機出題</p>
       <div class="chips" id="btChapChips"><span class="muted" style="font-size:13px">載入中…</span></div>
     </div>
     <div class="card" id="btCountCard"><h2>對戰題數</h2>
       <div class="stepper">
         <button onclick="btStep(-5)">−</button>
         <input class="val" id="btCountVal" type="number" inputmode="numeric" min="3" max="50" value="${bCount}" onchange="btClamp()" style="width:96px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)">
         <button onclick="btStep(5)">＋</button>
         <span class="muted" style="font-size:13px">題（3–50）</span>
       </div>
     </div>
     <button class="btn primary" style="width:100%;min-height:54px" onclick="battleStart()">開始對戰</button>
   </div>`;
  document.querySelectorAll('#btModeSeg button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#btModeSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); bMode=b.dataset.m;
    document.getElementById('btJoinWrap').style.display=(bMode==='join')?'block':'none';
    document.getElementById('btCountCard').style.display=(bMode==='join')?'none':'block';
    document.getElementById('btChapCard').style.display=(bMode==='join')?'none':'block';
    document.getElementById('btModeDesc').textContent=(bMode==='create')?'開房間：產生房碼給朋友加入。':(bMode==='join')?'加入房間：輸入朋友給的房碼，題數由房主決定。':'快速配對：和另一位在線等待的人自動配對。';
  });
  loadBattleChaps();
}
function btStep(d){let v=parseInt(document.getElementById('btCountVal').value)||10;document.getElementById('btCountVal').value=Math.max(3,Math.min(50,v+d));}
function btClamp(){let v=parseInt(document.getElementById('btCountVal').value)||10;document.getElementById('btCountVal').value=Math.max(3,Math.min(50,v));}

function battleStart(){
  bCount=Math.max(3,Math.min(50,parseInt(document.getElementById('btCountVal').value)||10));
  const hello={t:'hello',mode:bMode,token:clientToken(),name:'玩家',count:bCount};
  if(bMode!=='join' && bChap.size) hello.chapter_ids=[...bChap];
  if(bMode==='join'){const code=(document.getElementById('btCode').value||'').trim().toUpperCase();if(!code){toast('請輸入房碼');return;}hello.code=code;}
  battleWaiting('連線中…');
  try{ bws=new WebSocket(wsURL()); }catch(e){ battleWaiting('無法連線：'+e.message,true); return; }
  bws.onopen=()=>{try{bws.send(JSON.stringify(hello));}catch(e){}};
  bws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}onBattleMsg(m);};
  bws.onclose=()=>{ if(bstate&&bstate.phase!=='over'){battleWaiting('連線已中斷',true);} };
}
function battleWaiting(msg,err){
  bstate={phase:'waiting'};
  document.getElementById('battleScreen').innerHTML=BT_TOP+`<div class="qbody"><div class="card" style="text-align:center">
     <div id="btWaitBody"><p class="bt-status">${msg}</p></div>
     ${err?'<button class="btn primary" style="max-width:240px;margin:14px auto 0" onclick="renderBattleSetup()">返回</button>':''}
   </div></div>`;
}
function onBattleMsg(m){
  if(m.t==='error'){battleWaiting('⚠ '+m.msg,true);return;}
  if(m.t==='waiting'){
    const b=document.getElementById('btWaitBody'); if(!b)return;
    b.innerHTML=(m.mode==='create')?`<p class="bt-status">把房碼給朋友加入：</p><div class="bt-code">${m.code}</div><p class="bt-status">等待對手加入中…</p>`:`<p class="bt-status">快速配對中…<br>等待另一位玩家加入</p>`;
    return;
  }
  if(m.t==='start'){bstate={phase:'play',ys:0,os:0,total:m.total,scope:m.scope||''};return;}
  if(m.t==='round'){bRound(m);return;}
  if(m.t==='locked'){const s=document.getElementById('btOptStatus');if(s)s.textContent='已作答，等待對手…';return;}
  if(m.t==='result'){bResult(m);return;}
  if(m.t==='over'){bOver(m);return;}
}
function bRound(m){
  const _scope=(bstate&&bstate.scope)||'';
  bstate={phase:'play',i:m.i,total:m.total,ys:m.score.you,os:m.score.opp,q:m.q,picked:null,scope:_scope};
  if(bTimer)clearInterval(bTimer);
  const deadline=Date.now()+m.secs*1000; renderBattlePlay(deadline);
  bTimer=setInterval(()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));const el=document.getElementById('btCount');if(el){el.textContent=left;el.classList.toggle('warn',left<=5);}if(left<=0){clearInterval(bTimer);bTimer=null;}},250);
}
function btScopeText(s){ if(!s) return ''; const p=(''+s).split('、'); return p.length<=6?s:(p.slice(0,6).join('、')+'…等 '+p.length+' 章'); }
function renderBattlePlay(deadline){
  const q=bstate.q; const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  const opts=(q.options||[]).map(o=>`<button class="opt" id="btopt-${o.label}" onclick="bPick('${o.label}')"><span class="lb">${o.label}</span><span>${o.content}</span></button>`).join('');
  document.getElementById('battleScreen').innerHTML=`
   <div class="bt-head">
     <div class="bt-name">你</div>
     <div class="bt-score"><span class="me">${bstate.ys}</span><span class="vs">:</span><span class="op">${bstate.os}</span></div>
     <div class="bt-count" id="btCount">${left}</div>
   </div>
   <div class="bt-round">第 ${bstate.i} / ${bstate.total} 題　·　左邊你、右邊對手</div>
   ${bstate.scope?`<div class="bt-round" style="margin-top:0;color:var(--brand-2)">本場範圍：${btScopeText(bstate.scope)}</div>`:''}
   <div class="qbody"><div class="stem">${q.stem}</div>${opts}
     <p class="bt-status" id="btOptStatus">選擇你的答案（兩人都答完就立刻進下一題；限時 ${left>0?'':''}30 秒）</p>
   </div>`;
}
function bPick(k){
  if(!bstate||bstate.picked)return; bstate.picked=k;
  document.querySelectorAll('#battleScreen .opt').forEach(el=>el.style.pointerEvents='none');
  const el=document.getElementById('btopt-'+k); if(el)el.classList.add('sel');
  const st=document.getElementById('btOptStatus'); if(st)st.textContent='已作答，等待對手…';
  try{bws.send(JSON.stringify({t:'answer',i:bstate.i,selected:k}));}catch(e){}
}
function bResult(m){
  if(bTimer){clearInterval(bTimer);bTimer=null;}
  bstate.ys=m.you.score; bstate.os=m.opp.score;
  const sc=document.querySelector('#battleScreen .bt-score'); if(sc)sc.innerHTML=`<span class="me">${m.you.score}</span><span class="vs">:</span><span class="op">${m.opp.score}</span>`;
  document.querySelectorAll('#battleScreen .opt').forEach(el=>el.style.pointerEvents='none');
  const cor=document.getElementById('btopt-'+m.correct); if(cor)cor.classList.add('correct');
  if(m.you.picked&&!m.you.correct){const e=document.getElementById('btopt-'+m.you.picked);if(e)e.classList.add('wrong');}
  if(m.opp.picked){const e=document.getElementById('btopt-'+m.opp.picked);if(e)e.classList.add('op-pick');}
  const you=m.you.correct?'✓ 你答對':(m.you.picked?'✗ 你答錯':'✗ 你未作答');
  const opp=m.opp.picked?(m.opp.correct?'對手答對':'對手答錯'):'對手未作答';
  const st=document.getElementById('btOptStatus'); if(st)st.innerHTML=`正解 <b>${m.correct}</b>　·　${you}　·　${opp}<br><span style="font-size:11px">（灰框＝對手的選擇）</span>`;
}
function bOver(m){
  if(bTimer){clearInterval(bTimer);bTimer=null;}
  bstate={phase:'over'};
  const t=(m.outcome==='win')?'🏆 你贏了！':(m.outcome==='lose')?'😅 對手獲勝':'🤝 平手';
  const reason=(m.reason==='opp_left')?'（對手離線）':(m.reason==='speed')?'（比分相同，比作答速度）':'';
  document.getElementById('battleScreen').innerHTML=`
   <div class="quiz-top"><div class="row" style="justify-content:center"><b style="font-size:15px">對戰結束</b></div></div>
   <div class="qbody"><div class="card" style="text-align:center">
     <div class="bt-big">${t}</div>
     <div style="font-size:42px;font-weight:800;margin:8px 0"><span style="color:var(--brand)">${m.you}</span> <span class="muted" style="font-size:22px">:</span> <span style="color:var(--bad)">${m.opp}</span></div>
     <p class="muted" style="font-size:13px">你 ${m.you} 分　·　對手 ${m.opp} 分　${reason}</p>
   </div>
   <button class="btn primary" style="width:100%;min-height:52px" onclick="renderBattleSetup()">再來一場</button>
   <div style="height:10px"></div>
   <button class="btn ghost" style="width:100%;min-height:46px;flex:none" onclick="go('home')">回首頁</button>
   </div>`;
  if(bws){try{bws.onclose=null;bws.close();}catch(e){}bws=null;}
}


function startPresence(){ const ping=()=>{ api('/presence',{method:'POST'}).catch(()=>{}); }; ping(); setInterval(ping, 25000); }
renderChapters(); renderHome(); startPresence();

</script>
</body>
